<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Journal</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="scene">

        <div id="book">

            <!-- ESTADO 1: Cuaderno cerrado -->
            <div id="book-closed">
                <div id="shadow"></div>
                <img id="cover" src="assets/backgrounds/journal_closed.png" alt="Cuaderno de viaje">
                <div class="click-hint">Haz clic para abrir el diario</div>
            </div>

            <!-- ESTADO 2: Cuaderno abierto -->
            <div id="book-open" class="hidden">
                <!-- Botón de cerrar X en la esquina -->
                <button id="btn-close" class="close-btn-top" title="Cerrar cuaderno">✖</button>

                <!-- Flecha izquierda -->
                <button id="btn-prev" class="page-arrow arrow-left" title="Página anterior">❮</button>

                <!-- 1. CAPA INFERIOR (DEBAJO): La ilustración actual -->
                <div id="illustration-overlay">
                    <img id="current-page" src="" alt="Página del diario">
                </div>

                <!-- 2. CAPA SUPERIOR (ENCIMA): El marco de cuero real con calado transparente -->
                <img id="journal-frame" src="assets/backgrounds/journal_frame.png" alt="Marco del cuaderno">

                <!-- Flecha derecha -->
                <button id="btn-next" class="page-arrow arrow-right" title="Página siguiente">❯</button>
            </div>

        </div>

    </main>

    <script src="js/config.js"></script>
    <script src="js/book.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
